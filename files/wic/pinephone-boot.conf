# recovery_trigger_input is deliberately NOT set here.
#
# The initramfs decides recovery with "key-state $recovery_trigger_input", and
# key-state with no key argument returns 0 if *any* key on that device is
# pressed. On the PinePhone both volume keys are already claimed by Tow-Boot at
# boot - volume-down selects the SD card (boot_targets puts mmc1/eMMC first, so
# without it you boot eMMC), volume-up enters USB mass storage - so the
# documented way to boot this image is to hold volume-down, and that same press
# then always trips recovery:
#     Recovery trigger input: /dev/input/event1
#     Recovery mode: yes
# which drops to luneos_recovery_ui with no route out (USB networking needs a
# UDC the initramfs has no driver loaded for, and telnetd never comes up).
# pinetab2 gets away with event3 because nothing there needs a volume key held
# to boot. Recovery is still reachable by adding bootmode=recovery to this line.
title LuneOS
linux /Image
options console=tty0 console=ttyS0,115200 no_console_suspend earlycon=uart,mmio32,0x01c28000 panic=10 consoleblank=0 loglevel=1 cma=256M LUNEOS_NO_OUTPUT_REDIRECT
initrd /initramfs-simple-image-pinephone.cpio.gz
devicetree /sun50i-a64-pinephone.dtb
