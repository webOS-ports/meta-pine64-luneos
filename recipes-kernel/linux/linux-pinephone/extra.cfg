# LuneOS additions on top of megi's pinephone_defconfig.

# WiFi. megi's pinephone_defconfig still carries CONFIG_RTL8723CS=m, but that
# staging driver no longer exists in his tree - the symbol is dangling and
# silently drops out at olddefconfig, and his defconfig also turns every
# CONFIG_WLAN_VENDOR_* off, so building it as-is yields a PinePhone with no
# wireless at all.
#
# The supported path is now upstream rtw88: RTW88_8723CS selects RTW88_CORE,
# RTW88_SDIO and RTW88_8703B. megi's own 2026-08-01 notes say the 8703b driver
# is on par with the old 8723cs one now that the CCK RSSI regression is fixed
# (the LNA index was parsed as zero, so RSSI read up to 46 dB high, worst when
# the signal was weakest), and rtw88 is also where the 8723cs WoWLAN work landed.
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_REALTEK=y
# RTW88 is a menuconfig gating everything below it - without it the 8723CS
# option is not even reachable and silently disappears at olddefconfig.
CONFIG_RTW88=m
CONFIG_RTW88_8723CS=m

# Build Lima driver as module
CONFIG_DRM_SCHED=m
CONFIG_DRM_LIMA=m

# Some help for evdev
CONFIG_INPUT_UINPUT=y
CONFIG_KEYBOARD_SUN4I_LRADC=y

# This should be useful for rotation sensor
CONFIG_GPIO_SYSFS=y

# Needed in recovery to have usb powered
CONFIG_TYPEC_ANX7688=y

# --- Module trim, derived from sun50i-a64-pinephone-1.2.dtb ------------------
# Unlike the PineTab2 there is almost nothing to cut here: this config descends
# from megi's curated pinephone_defconfig, and its 307 modules map to real phone
# hardware and real phone functionality (modem, cameras, audio codecs, WiFi/BT,
# USB gadget, netfilter). Every IIO driver enabled corresponds to a sensor in
# the DTB - lis3mdl magnetometer, stk3311 light sensor, mpu6050 IMU, axp803 ADC -
# and AF8133J stays because some PinePhone revisions ship that magnetometer
# instead of the lis3mdl.
#
# Only three entries are genuinely dead:

# modem-power binds "quectel,eg25", and 0001-dts-pinephone-drop-modem-power-node
# removes that node because LuneOS drives the modem through ofono and
# eg25-manager. The module can never bind. (The quectel,ec25 node that remains is
# the audio codec, sound/soc/codecs/ec25.c - a different driver, still needed.)
# CONFIG_MODEM_POWER is not set

# No PinePhone mounts these.
# CONFIG_NILFS2_FS is not set
# CONFIG_XFS_FS is not set

# --- EFI boot ---------------------------------------------------------------
# CONFIG_EFI_STUB makes the kernel Image a PE/COFF EFI application, which is how
# it gets loaded (systemd-boot, or u-boot's bootefi). This was in the defconfig
# and the phone booted, but it was swept out with a defconfig regen in commit
# 2b3452a ("fix boot battery percentage") - EFI has nothing to do with battery,
# it was collateral. Pin it here as well as in the defconfig so a future regen
# or a kmeta BSP fragment cannot silently drop it again (extra.cfg is merged
# last). Matches the pre-2b3452a pinephone defconfig.
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFIVAR_FS=y

# --- initramfs decompressor -------------------------------------------------
# The initramfs is deployed as initramfs-simple-image-pinephone.cpio.gz, so the
# kernel needs the gzip initrd decompressor. A defconfig regen left only
# CONFIG_RD_LZ4=y with RD_GZIP off, and the phone then panicked in early boot:
#     Initramfs unpacking failed: decompressor failed
#     Kernel panic - not syncing: VFS: Unable to mount root fs on unknown-block(0,0)
# There is no fallback, because the systemd-boot entry passes no root= - the
# initramfs *is* the rootfs. Same collateral-regen problem as CONFIG_EFI_STUB
# above, and pinephonepro's defconfig still carries RD_GZIP=y. Pinned here as
# well as in the defconfig (extra.cfg is merged last).
CONFIG_RD_GZIP=y

# --- USB gadget -------------------------------------------------------------
# /sys/kernel/config/usb_gadget only exists once libcomposite is loaded, and
# with CONFIG_USB_CONFIGFS=m nothing ever loads it: luneos-usb-gadget.service
# is gated on
#     ConditionPathIsDirectory=/sys/kernel/config/usb_gadget
# which systemd evaluates before the unit runs, so the service is skipped
# silently (condition failed, not an error - nothing in the journal). The
# initramfs fails the same way, returning early from setup_usb_network_configfs
# on its own [ -e /config/usb_gadget ] check, which is why recovery mode printed
#     Cannot find device "usb0"
# and left no way in. Result: no USB networking in either initramfs or rootfs.
# pinephonepro and pinetab2 both carry USB_CONFIGFS=y and both work; only the
# pinephone defconfig has it as a module.
# Confirmed against the scarthgap branch, where USB networking worked: the entire
# gadget stack was built in there and the 7.2 defconfig regen made all of it
# modular (CONFIG_USB y->m, USB_LIBCOMPOSITE y->m, USB_MUSB_HDRC y->m,
# USB_MUSB_SUNXI y->m, USB_F_ECM y->m, USB_U_ETHER y->m, USB_F_RNDIS y->m).
# Restore the built-in set so the gadget exists before userspace looks for it.
CONFIG_USB=y
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_SUNXI=y
# musb_sunxi uses the NOP USB transceiver as its PHY. With NOP_USB_XCEIV=m,
# Kconfig cannot honour USB_MUSB_SUNXI=y (a built-in may not depend on a module)
# and silently demotes it back to =m, which leaves the initramfs with a gadget
# configfs but no UDC to bind to:
#     init_functions.sh: line 221: echo: write error: No such device
#     Cannot find device "usb0"
# So the PHY has to be built in as well.
CONFIG_NOP_USB_XCEIV=y
CONFIG_USB_U_ETHER=y
CONFIG_USB_F_ECM=y
CONFIG_USB_F_RNDIS=y
