
# --- USB Type-C must be built in, not a module ------------------------------
# CONFIG_PHY_ROCKCHIP_TYPEC is =y, and phy-rockchip-typec.c calls
# typec_switch_register(), typec_mux_register(), typec_switch_get_drvdata() and
# friends. Those live in mux.o, which is part of the typec module gated by
# CONFIG_TYPEC (drivers/usb/typec/Makefile: typec-y := class.o mux.o ...), so
# with CONFIG_TYPEC=m the vmlinux link fails:
#
#     phy-rockchip-typec.c:(.text+0xa34): undefined reference to
#                                         `typec_switch_register'
#
# The 6.5 defconfig had TYPEC_TCPM, TYPEC_FUSB302 and TYPEC_TCPCI all =y; the
# forward-port to 7.2 demoted them to =m while the PHY stayed built-in. Restore
# the built-in stack rather than demoting the PHY - this is the RK3399 Type-C
# port the PinePhone Pro actually uses for USB3 and DP alt-mode.
CONFIG_TYPEC=y
CONFIG_TYPEC_TCPM=y
CONFIG_TYPEC_TCPCI=y
CONFIG_TYPEC_FUSB302=y

# --- The Type-C PHY must be built in, and must survive the BSP fragment -----
# ff7c0000.phy never probed at all on the first 7.2 boot - no probe line, no
# error, not even a deferred-probe entry. The driver simply was not in the
# kernel: our defconfig says =y, but the kmeta BSP fragment overrides it,
#
#   genericarm64.cfg:1673:  CONFIG_PHY_ROCKCHIP_TYPEC=m
#   "Value of CONFIG_PHY_ROCKCHIP_TYPEC is redefined by fragment ...
#    Previous value: =y   New value: =m"
#
# and it came out of the build unset altogether. Everything downstream of the
# RK3399 Type-C PHY then falls over in a chain that looks like three unrelated
# bugs but is one:
#
#   ff7c0000.phy    never binds        -> no USB3 phy, no DP phy
#   fe800000.usb    dwc3: failed to initialize core        -> USB dead
#   i2c 4-0022      cannot register tcpm port              -> no charger supply
#   rk818-charger   supplier 4-0022 not ready              -> no battery
#   fec00000.dp     wait for supplier /phy@ff7c0000/dp-port
#                   ^ a *component* of rockchip-drm, so the display component
#                     master never completes -> no panel at all, and panfrost
#                     ends up on DRM minor 0 because nothing else registered.
#
# Setting it here (extra.cfg is merged after the BSP fragments) pins it back.
CONFIG_PHY_ROCKCHIP_TYPEC=y

# genericarm64.cfg demotes the display driver too (CONFIG_DRM_ROCKCHIP=m).
# It happened to survive as =y in the last build, but pin it so a change in
# fragment ordering cannot quietly turn the panel into a loadable module.
CONFIG_DRM_ROCKCHIP=y

# --- Scale the CPU, do not pin it at maximum --------------------------------
# The defconfig selected CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE, and nothing
# in the image switches governors afterwards, so both clusters sat at their
# maximum OPP permanently - measured on device as
#
#   policy0 gov=performance cur=1008000 max=1008000
#   policy4 gov=performance cur=1500000 max=1500000
#
# with the screen off and the system idle. That is the little cluster held at
# 1.0 GHz and the big cluster at 1.5 GHz around the clock, on a phone. The
# sibling pinephone defconfig already selects schedutil; this one was simply
# inconsistent.
#
# schedutil is built in (CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y) and is the right
# choice for this SoC: it is driven by the scheduler's own utilisation signal
# and cooperates with the energy model the kernel builds for big.LITTLE (the
# "EM: OPP:408000 is inefficient" lines at boot are that model being set up).
# Pinned here as well as in the defconfig because extra.cfg is merged after the
# kmeta BSP fragments, which have a history of redefining values in this tree.
# CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE is not set
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
