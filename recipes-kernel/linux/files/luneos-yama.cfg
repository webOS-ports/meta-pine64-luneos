# Yama, for kernel.yama.ptrace_scope (meta-webos-ports systemd-conf's
# luneos-hardening.conf sets it to 1): without Yama the sysctl does not
# exist and any process may ptrace every other process of the same user.
# Yama must also be in each kernel's CONFIG_LSM list (the defconfigs).
CONFIG_SECURITY=y
CONFIG_SECURITY_YAMA=y
