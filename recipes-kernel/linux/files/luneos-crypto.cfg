# Copied from meta-luneos' linux-yocto bbappend
# (meta-webos-ports/meta-luneos/recipes-kernel/linux/linux-yocto/crypto.cfg).
# That bbappend only applies to linux-yocto, so the Pine64 kernels never got these.
# Keep in sync with the original if it changes.

CONFIG_CRYPTO_RNG=y
CONFIG_CRYPTO_NULL=y
CONFIG_CRYPTO_ECB=y
CONFIG_CRYPTO_XCBC=y
CONFIG_CRYPTO_MD4=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_ARC4=y
CONFIG_CRYPTO_TWOFISH=y
CONFIG_CRYPTO_TWOFISH_COMMON=y
CONFIG_CRYPTO_DEFLATE=y
