# megi's tree extends drivers/net/wireless/st/cw1200 to claim
# SDIO_DEVICE(SDIO_VENDOR_ID_BES, 0x2002) - the same device the out-of-tree
# bes2600-module binds to. Keep it off so ours wins.
# CONFIG_CW1200 is not set

# megi's rk3566-pinetab2.dtsi adds a usb-typec@4e node,
# compatible = "hynetek,husb311", "richtek,rt1711h". The fallback compatible is
# what binds, so enable the RT1711H TCPCI driver to get USB-C role switching and
# PD negotiation instead of a dead node.
CONFIG_TYPEC_RT1711H=y

# --- Trim hardware the PineTab2 does not have -------------------------------
# The 6.6.9 defconfig this was forward-ported from was a full .config dump with
# ~1250 modules enabled, most of them for hardware an RK3566 tablet cannot have.
# MEDIA_SUPPORT_FILTER is already set, so the four switches below gate whole
# driver trees: analog TV, DVB, radio and SDR account for the bulk of it.
# Camera and platform media support stay on - the PT2 has cameras and the
# Rockchip/cedrus codecs live under MEDIA_PLATFORM_SUPPORT.
# CONFIG_MEDIA_ANALOG_TV_SUPPORT is not set
# CONFIG_MEDIA_DIGITAL_TV_SUPPORT is not set
# CONFIG_MEDIA_RADIO_SUPPORT is not set
# CONFIG_MEDIA_SDR_SUPPORT is not set
# CONFIG_MEDIA_CONTROLLER_DVB is not set

# No InfiniBand/RDMA fabric, no parallel port, no Memory Stick reader.
# CONFIG_INFINIBAND is not set
# CONFIG_PARPORT is not set
# CONFIG_MEMSTICK is not set

# WiFi is the BES2600 over SDIO; no Atheros radio and no Intel NIC on this board.
# CONFIG_WLAN_VENDOR_ATH is not set
# CONFIG_NET_VENDOR_INTEL is not set

