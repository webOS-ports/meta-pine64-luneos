#@TYPE: Machine
#@NAME: Pine64 PinePhonePro RK3399S
#@DESCRIPTION: PinePhone Pro based on Rockchip RK3399S Processor.

require conf/machine/include/rock-pi-4.inc

# Override the DEFAULTTUNE that's coming from meta-rockchip layer for RK3399 (https://git.yoctoproject.org/meta-rockchip/tree/conf/machine/include/rk3399.inc#L6), so we can reuse our existing aarch64 packages and are not rebuilding intensive bits such as Qt (Base/WebEngine etc).

DEFAULTTUNE = "aarch64"

PREFERRED_PROVIDER_virtual/kernel = "linux-pinephonepro"

KERNEL_DEVICETREE = "rockchip/rk3399-pinephone-pro.dtb"
UBOOT_MACHINE = "pinephone-pro-rk3399_defconfig"

IMAGE_FSTYPES += "wic.gz wic.bmap"

# NOTE: do NOT naively switch this to initramfs-simple-image + cpio.gz.
#
# Doing so makes the initramfs actually unpack (as cpio.gz.u-boot it does not -
# u-boot leaves the 64-byte mkimage header on, the kernel sees 0x27051956
# instead of gzip magic, prints "Initramfs unpacking failed: invalid magic at
# start of compressed archive" and discards it). The device still boots because
# root=PARTLABEL=rootfsA mounts the rootfs directly.
#
# But once init.sh really runs it calls
#
#   mount_root_partition "luneos-root" "/rfs"
#
# which locates the rootfs with   find /dev -name luneos-root*
#
# The PineTab2's partition is labelled "luneos-rootfs" so it matches; the
# PinePhone Pro's is labelled "rootfsA", so nothing is found, the mount fails,
# and init.sh calls fail() -> loop_forever. The result is a hang in early boot
# just after /INIT instead of a working device.
#
# The cost of leaving it wrapped is that setup_usb_network 172.16.42.2/16 never
# runs, so there is no configfs USB gadget - the UDC comes up unbound. That is
# better fixed with a rootfs-level gadget service, which does not depend on the
# initramfs at all. Revisit only together with the rootfs label mismatch.
INITRAMFS_IMAGE = "initramfs-uboot-image"

WKS_CONSOLE_PARAMS = "LUNEOS_NO_OUTPUT_REDIRECT"

WKS_FILE_DEPENDS ?= " \
    initramfs-uboot-image \
    "

IMAGE_BOOT_FILES ?= " \
    initramfs-uboot-image-pinephonepro.cpio.gz.u-boot;initramfs-uboot-image-pinephonepro.uboot \
    "

# After https://git.openembedded.org/openembedded-core/commit/?h=kirkstone&id=b0f8d8a4c063936b50d3ec7c066b29157b3c3544
# this needs to match with what IMAGE_FSTYPES we set in initramfs image, in this case:
# recipes-core/images/initramfs-uboot-image.bb:IMAGE_FSTYPES:forcevariable = "cpio.gz.u-boot"
FIT_SUPPORTED_INITRAMFS_FSTYPES = "cpio.gz.u-boot"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
MACHINE_EXTRA_RDEPENDS = " \
    linux-firmware-pine64 \
    kernel-modules \
    \
    qtsensors-sensorfw-plugin \
    sensorfw \
    \
    eg25-manager \
"
