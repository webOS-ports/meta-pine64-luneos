#@TYPE: Machine
#@NAME: Pinephone "Don't be evil" devkit board
#@DESCRIPTION: An Allwinner based development board http://wiki.pine64.org/index.php/Project_Don't_be_evil

require conf/machine/include/arm/arch-arm64.inc

PREFERRED_PROVIDER_virtual/bootloader ?= "systemd-boot"

EXTRA_IMAGEDEPENDS += "systemd-boot"
#UBOOT_MACHINE ?= "pinephone_defconfig"
#UBOOT_BINARY ?= "u-boot-sunxi-with-spl.bin"
#UBOOT_ENV ?= "boot"
#UBOOT_ENV_SUFFIX ?= "scr"
#SPL_BINARY ?= "spl/sunxi-spl.bin"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
MACHINE_EXTRA_RDEPENDS = " \
    linux-firmware-pine64 \
    kernel-modules \
    \
    qtsensors-sensorfw-plugin \
    sensorfw \
    \
    eg25-manager \
    \
    libcamera \
    libcamera-gst \
"

IMAGE_FSTYPES += "wic.gz wic.bmap"
WKS_FILE = "pinephone-luneos-bsp-image.wks"
WKS_FILE_DEPENDS ?= " \
    e2fsprogs-native \
    mtools-native \
    dosfstools-native \
    systemd-boot \
    virtual/kernel \
    initramfs-simple-image \
"
IMAGE_EFI_BOOT_FILES = " \
    sun50i-a64-pinephone-1.2.dtb;sun50i-a64-pinephone.dtb \    
    Image \
    initramfs-simple-image-pinephone.cpio.gz \
"

do_image_wic[depends] += "initramfs-simple-image:do_image_complete"

PREFERRED_PROVIDER_virtual/kernel = "linux-pinephone"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "allwinner/sun50i-a64-pinephone-1.2.dtb"

SERIAL_CONSOLES = "115200;ttyS0;tty0"
MACHINE_FEATURES = "alsa apm keyboard rtc serial screen touchscreen usbgadget usbhost vfat ext2 ext3 wifi"

# Boot-time hardware state dump - see recipes-support/luneos-diag
MACHINE_EXTRA_RRECOMMENDS += "luneos-diag"

# USB gadget from the rootfs - see recipes-connectivity/luneos-usb-gadget
MACHINE_EXTRA_RRECOMMENDS += "luneos-usb-gadget"

# PinePhone keyboard case tools - see recipes-support/ppkb-tools
MACHINE_EXTRA_RRECOMMENDS += "ppkb-tools"

# Restore the codec mixer state at boot - see recipes-bsp/alsa-state
# alsactl is already in the image; only the state file is missing.
#
# The sun8i-codec powers up with 'Line Out' at 100% volume but the switch off, so
# the loudspeaker is silent even though PulseAudio loads pcm_output as the default
# sink and streams play into it - no error anywhere, just silence. The state file
# was captured with alsactl from this device after
#     alsaucm -c PinePhone set _verb HiFi set _enadev Speaker
# with the speaker confirmed audible. It is keyed by card name (state.PinePhone),
# which matters here as much as on the other two boards: the PinePhone
# simple-card and sun9i-hdmi have been seen at both index 0 and index 1 across
# reboots of the same image.
MACHINE_EXTRA_RRECOMMENDS += "alsa-state"

# Cameras. These gate the camera app and v4l-utils in packagegroup-luneos-extended
# (and camera-front additionally gates luneos-faced for face unlock). Both go
# through V4L2 rather than binder, so the topology is worth declaring on a
# mainline machine too.
#
# The app used to be an unconditional member of that packagegroup; when it became
# feature-gated, the machines in meta-smartphone were updated but the pine64 ones
# here were not, so all three silently lost their camera app.
#
# Verified on-device: ov5640 at 3-004c (rear-camera@4c), gc2145 at 3-003c
# (front-camera@3c), both enumerated by libcamera's simple pipeline handler.
MACHINE_FEATURES += "camera-rear camera-front"

# Six DIP switches behind the back cover: modem, WiFi/BT, microphone, both
# cameras and the headphone jack. They cut power rather than signalling
# anything, so the hardware simply stops existing and its absence is the only
# reading available - which is what killswitchd.conf.pinephone describes.
# "killswitch" pulls in the daemon that does that reading.
MACHINE_FEATURES += "killswitch"
