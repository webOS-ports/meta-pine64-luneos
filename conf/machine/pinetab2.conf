#@TYPE: Machine
#@NAME: Pine64 PineTab2 RK3566
#@DESCRIPTION: PineTab2 based on Rockchip RK3566 Processor.

require rk3566.inc

# Override the DEFAULTTUNE that's coming from meta-rockchip layer for RK3566 (https://git.yoctoproject.org/meta-rockchip/tree/conf/machine/include/rk3566.inc#L6), so we can reuse our existing aarch64 packages and are not rebuilding intensive bits such as Qt (Base/WebEngine etc).

DEFAULTTUNE = "aarch64"

PREFERRED_PROVIDER_virtual/kernel = "linux-pinetab2"

KERNEL_DEVICETREE = "rockchip/rk3566-pinetab2-v2.0.dtb"
UBOOT_MACHINE = "pinetab2-rk3566_defconfig"

IMAGE_FSTYPES += "wic.gz wic.bmap"

INITRAMFS_IMAGE = "initramfs-simple-image"
INITRAMFS_IMAGE_BUNDLE = "1"

IMAGE_BOOT_FILES ?= "fitImage"

WKS_FILE = "pinetab2-luneos-bsp-image.wks"

WKS_FILE_DEPENDS ?= " \
    initramfs-simple-image \
    "
    
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
# No eg25-manager: that is the Quectel EG25 WWAN daemon for the PinePhone and
# PinePhone Pro. The PineTab2 has no EG25, so the service only ever aborted -
# "eg25-manager.service failed" plus a SIGABRT coredump on every boot.
MACHINE_EXTRA_RDEPENDS = " \
    linux-firmware-pine64 \
    kernel-modules \
    bes2600-module \
    \
    qtsensors-sensorfw-plugin \
    sensorfw \
    \
    libcamera \
    libcamera-gst \
"

# Boot-time hardware state dump - see recipes-support/luneos-diag
MACHINE_EXTRA_RRECOMMENDS += "luneos-diag"

# Restore the codec mixer state at boot - see recipes-bsp/alsa-state
# alsactl is already in the image; only the state file is missing.
MACHINE_EXTRA_RRECOMMENDS += "alsa-state"

# Cameras: front and rear. These gate the camera app and v4l-utils in
# packagegroup-luneos-extended (and camera-front additionally gates luneos-faced
# for face unlock). Both go through V4L2 rather than binder, so the topology is
# worth declaring on a mainline machine too.
#
# The app used to be an unconditional member of that packagegroup; when it became
# feature-gated, the machines in meta-smartphone were updated but the pine64 ones
# here were not, so all three silently lost their camera app.
MACHINE_FEATURES += "camera-rear camera-front"
