# Preload the sensors clients ask for first, via the preload_sensors support
# added in 0002-sensorfwd-Preload-sensors-listed-in-preload_sensors-.patch.
# sensord-pinetab2.conf already does this; the PinePhone config did not.
# rotationsensor is included because that is what QtSensors clients (Messwerk)
# request - it only became loadable once libmagcalibrationchain-qt6.so was made
# resolvable at runtime (see sensorfw.bbappend; patch 0005 declared the link but
# nothing put ${libdir}/sensord-qt6 on the linker path).
preload_sensors="accelerometersensor,orientationsensor,rotationsensor"

[plugins]
accelerometeradaptor = iiosensorsadaptor
orientationadaptor = iiosensorsadaptor
alsadaptor = iiosensorsadaptor
magnetometeradaptor = iiosensorsadaptor
gyroscopeadaptor = iiosensorsadaptor

[accelerometer]
input_match=mpu6050
intervals = "200=>2000"
default_interval=500
transformation_matrix = "0,1,0,-1,0,0,0,0,1"

[als]
input_match=stk3310
intervals = "200=>2000"
default_interval=500

[gyroscope]
input_match=mpu6050
intervals = "200=>2000"
default_interval=500

[magnetometer]
input_match=lis3mdl
intervals = "200=>2000"
default_interval=500

[lis3mdl]
scale = 1.0

# sensorfwd logs, on every boot:
#     "<proximityadaptor> Adaptor is already present!"
#     "proximityadaptor"    No sysfs path defined for: "proximity"
#     "magnetometeradaptor" No sysfs path defined for: "magnetometer"
#     "gyroscopeadaptor"    No sysfs path defined for: "gyroscope"
# Accelerometer and ALS are absent from that list, which is why UI rotation works
# while gyro/magnetometer/proximity report nothing. The three that fail are
# exactly the ones with no section of their own here, and the two sharing an IIO
# device with a working sensor (mpu6050 = accel+gyro, stk3310 = als+proximity).
# sensord-pinephonepro.conf carries all of these blocks and does not show the
# errors. Copied from it; the [lis3mdl] scale is part of that set.
#
# NOTE: not yet verified to fix the "No sysfs path" errors - the adaptor may be
# failing to claim an IIO device that is already in use rather than missing
# config. Test with: systemctl restart sensorfwd, then check the log again.
[proximity]
input_match=stk3310
intervals = "200=>2000"
default_interval=500
threshold=19
