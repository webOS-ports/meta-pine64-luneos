# Force-enable the sensor plugins regardless of the hw-features that
# 20-sensors-default.conf would otherwise gate them on, and preload them at
# sensorfwd startup.
#
# Without the preload, the libqtsensors_sensorfw.so backend that LSM's
# OrientationSensor goes through calls requestSensor() before anything has
# called loadPlugin(), and sensorfwd answers "requested sensor id ... not
# registered". The visible result on a PineTab2 is that the screen does not
# rotate after boot, but starts rotating as soon as any sensor app (Messwerk)
# is opened - because that app loads the plugin the compositor needed.
# See the 0002-sensorfwd-Preload-sensors-listed-in-preload_sensors- recipe
# patch, and sensord-tenderloin.conf which has carried this since the 3.x days.
#
# The quotes matter. sensorfw parses these with QSettings/IniFormat, which turns
# an unquoted comma-separated value into a QStringList - and the preload code
# reads it with value<QString>(), where a multi-element list stringifies to "".
# So an unquoted list is silently read as empty and nothing gets preloaded.
accelerometersensor=True
orientationsensor=True
preload_sensors="accelerometersensor,orientationsensor"

[plugins]
accelerometeradaptor = iiosensorsadaptor
orientationadaptor = iiosensorsadaptor

[accelerometer]
input_match=sc7a20
intervals = "1,10,25,50,100,200,400,1600"
default_interval = 200
transformation_matrix = "1,0,0,0,0,1,0,-1,0"
mode = 1
