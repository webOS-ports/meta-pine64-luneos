# Turn on the bes2600 firmware-download logging at load time.
#
# bes_devel() maps to dev_dbg(), which the kernel gates behind dynamic debug,
# so the messages are compiled in but silent until enabled. "+p" enables every
# dbg site in this module; the driver logs each stage of the download, which is
# what we need to see which one precedes:
#
#     wait dpd data ready failed:-110
#
# This is a diagnostic aid, not something to ship long term - it is noisy.
# Delete this file (or drop bes2600-dbg-config from the machine) to silence it.
options bes2600 dyndbg=+p
