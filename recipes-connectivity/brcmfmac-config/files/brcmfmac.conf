# Disable the brcmfmac firmware supplicant (BRCMF_FEAT_FWSUP = BIT(13)).
#
# When the firmware answers the "sup_wpa" iovar, brcmfmac advertises
# NL80211_EXT_FEATURE_4WAY_HANDSHAKE_STA_PSK to wpa_supplicant. wpa_supplicant
# then stops running the WPA2 4-way handshake itself and simply hands the PSK
# to the firmware (brcmf_set_pmk) and waits for a "connected" event.
#
# On the PinePhone Pro (CYW43455, BCM4345C0) that event never arrives, so the
# connection dies with a bare timeout and no handshake diagnostics at all -
# because no handshake was ever run in software:
#
#   wlan0: Associated with cc:28:aa:a1:45:84
#   wlan0: Authentication with cc:28:aa:a1:45:84 timed out.
#   wlan0: CTRL-EVENT-DISCONNECTED reason=3 locally_generated=1
#
# Note what is absent: no EAPOL frames, and no "WPA: 4-Way Handshake failed"
# from wpa_supplicant. A software 4-way that failed would have said so.
#
# Clearing the feature bit puts the 4-way back in wpa_supplicant, which is the
# ordinary path for every non-offloading driver.
#
# Trade-off: SAE_OFFLOAD is advertised inside the same FWSUP block in
# brcmf_cfg80211_attach(), so this also gives up WPA3-SAE, which on brcmfmac
# can only be done by the firmware. That is an acceptable trade while WPA2 does
# not work at all; delete this file to get it back.
options brcmfmac feature_disable=0x2000
